[package]
name = "idevice_pair"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = "0.36.2"
rfd = "0.15"
tokio = { version = "1.0", features = ["full"] }
idevice = { git = "https://github.com/jkcoxson/idevice", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true